# Sectra Web Banner: Namensgleiche Patient:innen
#
# docker compose up -d --build
# → 127.0.0.1:43002 (POST /banner, GET /banner?context=…, GET /health)

services:
  banner:
    build: .
    image: dupes-banner
    restart: unless-stopped
    ports:
      - "127.0.0.1:43002:8000"
    env_file:
      - .env
    # Der Docker-Host injiziert einen Proxy; PACS und Healthcheck müssen direkt erreicht werden
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
